[package]
name = "recto"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/TheSnapped/Recto"
description = "Recto: a lightweight, quick-starting PDF viewer for Windows (MuPDF backend)"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow"] }
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"] }
mupdf-sys = { version = "0.8", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_Xps", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
# Test driver: replays input from a file named by RECTO_SCRIPT (see src/script.rs).
script = []

[build-dependencies]
winresource = "0.1"

[profile.dev]
debug = "line-tables-only"
incremental = false

# Rendering in an unoptimised debug build is slow; keep dependencies fast.
[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# mupdf 0.8.0 doesn't compile on MSVC (a missing `max_align_t`); patches/mupdf is the
# published crate with the upstream one-line fix. Remove once a newer mupdf is released.
[patch.crates-io]
mupdf = { path = "patches/mupdf" }
